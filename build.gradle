plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'dev.farskies'
base { archivesName = 'random-item-skyblock' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}
neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            if (project.hasProperty('clientSmoke')) gameDirectory = file('run-qa')
            if (project.hasProperty('clientSmoke')) systemProperty 'farskies.clientSmoke', 'true'
            if (project.hasProperty('hudSmoke')) systemProperty 'farskies.hudSmoke', 'true'
            if (project.hasProperty('recoverySmoke')) systemProperty 'farskies.recoverySmoke', 'true'
            if (project.hasProperty('visualSmoke')) systemProperty 'farskies.visualSmoke', 'true'
            if (project.hasProperty('gallerySmoke')) systemProperty 'farskies.gallerySmoke', 'true'
            if (project.hasProperty('galleryScript')) systemProperty 'farskies.galleryScript', file(project.property('galleryScript')).absolutePath
            if (project.hasProperty('reviewWorld')) systemProperty 'farskies.reviewWorld', project.property('reviewWorld')
            if (project.hasProperty('normalSmoke')) systemProperty 'farskies.normalSmoke', 'true'
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'farskies'
            systemProperty 'farskies.qa', 'true'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { farskies { sourceSet(sourceSets.main) } }
}
dependencies {
    compileOnly fileTree(dir: 'pack-runtime', include: ['open-parties-and-claims*.jar', 'ChanceCubes*.jar', 'chancecubes*.jar', 'PickUpNotifier*.jar', 'puzzleslib*.jar','FarmersDelight*.jar','create-1.21.1-*.jar','exdeorum-*.jar','emi-*.jar'])
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (project.hasProperty('packRuntime')) {
        def lock = new groovy.json.JsonSlurper().parseText(providers.fileContents(layout.projectDirectory.file('pack/mods.lock.json')).asText.get())
        def selected = lock.mods.findAll { (project.hasProperty('clientRuntime') || it.server != 'unsupported') && !(project.hasProperty('clientSmoke') && it.filename.startsWith('dynamic-fps')) }
        localRuntime files(selected.collect { file('pack-runtime/' + it.filename) })
    }
}
test { useJUnitPlatform() }
def modVersion = project.mod_version
tasks.named('processResources') {
    inputs.property 'mod_version', modVersion
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: modVersion) }
}
tasks.named('jar') {
    exclude 'dev/farskies/qa/**', 'dev/farskies/*GameTests*', 'data/farskies/structure/empty.nbt'
    from 'LICENSE'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
